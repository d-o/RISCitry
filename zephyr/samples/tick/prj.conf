# Trimmed to fit the 16 KB RAM (code + data + stacks share it)
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=256
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_ASSERT=n
CONFIG_THREAD_NAME=n
CONFIG_BOOT_BANNER=n
CONFIG_TIMESLICING=n
CONFIG_CBPRINTF_NANO=y
CONFIG_THREAD_STACK_INFO=n
CONFIG_THREAD_LOCAL_STORAGE=n

# Size trims (trial 2026-11-03): RAM 15,696 -> 13,936 B. NOT yet run in xsim or on the board.
CONFIG_TIMEOUT_64BIT=n
CONFIG_EXCEPTION_STACK_TRACE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_KERNEL_MEM_POOL=n
CONFIG_COMMON_LIBC_MALLOC=n
CONFIG_SYS_HEAP_HARDENING_NONE=y
CONFIG_ASSERT_VERBOSE=n
